name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lint runs on ubuntu for speed/cost — ruff and mypy are platform-agnostic.
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Ruff format check
        run: uv run ruff format --check src/

      - name: Mypy
        run: uv run python -m mypy src/

  # Tests must run on Windows — this is a Windows-only app (Star Citizen,
  # PyQt6 display, QSettings registry, Windows path conventions).
  test:
    name: Tests (${{ matrix.resolution }} dependencies)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [highest, lowest-direct]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --resolution ${{ matrix.resolution }}

      - name: Tests
        run: uv run --locked --resolution ${{ matrix.resolution }} python -m pytest tests/ -p no:xdist --tb=short -q --cov=src --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report-${{ matrix.resolution }}
          path: coverage.xml
          retention-days: 30
